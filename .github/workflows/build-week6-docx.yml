name: Build Week 6 Substack DOCX
on:
  push:
    paths:
      - '.github/workflows/build-week6-docx.yml'
      - 'scripts/build_week6_substack_docx.py'
      - 'data/projections/2026_week6_2026_target_share_review.csv'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python scripts/build_week6_substack_docx.py
      - name: Commit Word document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projections/Roster_Report_Week6_Substack_Updated.docx
          git diff --cached --quiet || (git commit -m 'Build updated Week 6 Substack Word article' && git push)
