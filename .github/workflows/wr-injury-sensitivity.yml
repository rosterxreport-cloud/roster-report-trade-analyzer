name: WR Injury Sensitivity
on:
  push:
    paths:
      - scripts/projection_wr_injury_sensitivity.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_injury_sensitivity.py --stat ydspg --weight 0.30 --exp-weight 1.00 --snap-weight 0.30 --def-weight 0.20 --over-weight 0.20 --mid-weight 0.20 --trend-weight 0.20 --trend-threshold 0.03 --out data/backtests/wr_injury_sensitivity
