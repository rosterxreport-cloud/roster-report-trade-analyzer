name: Week 1-2 Projection Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-weekly-backtest.py'
      - '.github/workflows/backtest-weeks-1-2.yml'

permissions:
  contents: read

jobs:
  backtest-cuts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Fetch frozen Week 1 and Week 2 repository priors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/priors
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/players.json?ref=fd87448dd9f9dc8fb50d40ae06bb9bb832b19100" -o data/backtests/priors/week1_players.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/players.json?ref=b73d8f29b5c6dd9cd7f2710a300cd02ba52d57ad" -o data/backtests/priors/week2_players.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/injury-adjustments.json?ref=4a9cde1ab0a7b9381a198fa4626b4cf5060dbab3" -o data/backtests/priors/week1_injuries.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/injury-adjustments.json?ref=cee5538d094d519a480ca26be1eb61f4a3c4bc01" -o data/backtests/priors/week2_injuries.json
          python - <<'PY'
          import json
          for w in (1,2):
              p=f'data/backtests/priors/week{w}_players.json'
              d=json.load(open(p))
              assert all(k in d for k in ('standard','half','ppr'))
              print(w, {k:len(d[k]) for k in ('standard','half','ppr')})
          PY
      - name: Build leakage-safe Week 1-2 cuts
        run: python scripts/build-weekly-backtest.py
      - name: Validate cutoff rules
        run: |
          python - <<'PY'
          import pandas as pd, json
          w1=pd.read_csv('data/backtests/week1_prior_2026.csv')
          w2=pd.read_csv('data/backtests/week2_prior_2026.csv')
          m=json.load(open('data/backtests/manifest.json'))
          assert len(w1)==0, f'Week 1 leaked {len(w1)} 2026 rows'
          assert set(w2.week.unique()) <= {1}, f'Week 2 leaked weeks {w2.week.unique()}'
          print('Cutoffs valid',m['rows'])
          PY
      - name: Run point-in-time historical projection baseline
        run: python scripts/run-historical-weekly-projections.py
      - name: Grade projections when historical runner output exists
        run: python scripts/grade-weekly-backtest.py
      - name: Upload backtest cuts
        uses: actions/upload-artifact@v4
        with:
          name: roster-report-week1-week2-backtest
          path: data/backtests/
          retention-days: 30

