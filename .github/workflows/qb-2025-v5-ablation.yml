name: QB 2025 V5 Passing Metric Ablation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/tune-qb-model-2025-v5-metric-ablation.py']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - run: python scripts/tune-qb-model-2025-v5-metric-ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: qb-2025-v5-ablation
          path: |
            data/qb-2025-v5-metric-ablation.csv
            data/qb-2025-v5-single-metrics.csv
