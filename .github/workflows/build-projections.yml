name: Build Projection Models

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/coaching_scheme_2026.csv'
      - 'data/rookie_rb_college_2026.csv'
      - 'projection-model-v0.4.mjs'
      - 'projection-model-runtime.mjs'
      - 'players.json'
      - '.github/workflows/build-projections.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Build 2023-2025 feature tables
        run: python scripts/build-nflverse-features.py
      - name: Fit next-season models
        run: python scripts/fit-projection-models.py
      - name: Build 2026 history-only baseline
        run: python scripts/apply-projection-models.py
      - name: Build 2026 team and player context
        run: python scripts/build-2026-context.py
      - name: Apply latest 2026 depth chart
        run: python scripts/apply-2026-depth-charts.py
      - name: Apply vacated receiving opportunity
        run: python scripts/apply-vacated-receiving-opportunity.py
      - name: Build returning-player fallbacks
        run: python scripts/build-returning-player-fallbacks.py
      - name: Apply returning-player fallbacks
        run: python scripts/apply-returning-player-fallbacks.py
      - name: Build 2026 veteran stat projections
        run: python scripts/build-2026-stat-projections.py
      - name: Normalize draft-pick data
        run: python scripts/normalize-draft-picks.py
      - name: Apply 2026 rookie/no-history model
        run: python scripts/apply-2026-rookie-model.py --draft-source data/projections/draft_picks_normalized.csv
      - name: Apply rookie RB college-to-NFL translation
        run: python scripts/apply-rookie-rb-college-translation.py
      - name: Apply two-way offensive participation adjustment
        run: python scripts/apply-two-way-role-adjustment.py
      - name: Reconcile 2026 opportunity
        run: python scripts/reconcile-2026-opportunity.py
      - name: Apply 2026 coaching and scheme context
        run: python scripts/apply-coaching-scheme-context.py
      - name: Apply vacated RB opportunity
        run: python scripts/apply-vacated-rb-opportunity.py
      - name: Reconcile current RB workload hierarchy
        run: python scripts/reconcile-rb-workload-hierarchy.py
      - name: Apply RB bellcow and coaching rush scheme
        run: python scripts/apply-rb-bellcow-scheme.py
      - name: Reconcile current-role RB receiving opportunity
        run: python scripts/apply-rb-receiving-opportunity.py
      - name: Reconcile RB rushing touchdowns
        run: python scripts/reconcile-rb-rushing-touchdowns.py
      - name: Apply veteran RB talent and efficiency
        run: python scripts/apply-rb-talent-efficiency.py
      - name: Apply young-player role expansion
        run: python scripts/apply-role-expansion.py
      - name: Apply recent target hierarchy
        run: python scripts/apply-target-hierarchy.py
      - name: Apply recent-role target earning
        run: python scripts/apply-recent-role-target-earning.py
      - name: Apply availability-neutral WR target earning
        run: python scripts/apply-availability-neutral-wr-role.py
      - name: Reconcile same-team WR depth hierarchy
        run: python scripts/reconcile-wr-depth-hierarchy.py
      - name: Apply competition-adjusted WR target growth guardrail
        run: python scripts/apply-target-growth-guardrail.py
      - name: Apply WR YPC/YPRR efficiency weighting
        run: python scripts/apply-wr-efficiency-weight.py
      - name: Reconcile starter QB passing
        run: python scripts/reconcile-qb-passing.py
      - name: Reconcile mobile QB rushing
        run: python scripts/reconcile-qb-rushing.py
      - name: Apply QB receiving environment
        run: python scripts/apply-qb-receiving-environment.py
      - name: Apply WR archetype catch-rate regression
        run: python scripts/apply-wr-catch-rate-regression.py
      - name: Reconcile receiving touchdowns
        run: python scripts/reconcile-receiving-touchdowns.py
      - name: Reconcile RB receiving touchdowns
        run: python scripts/reconcile-rb-receiving-touchdowns.py
      - name: Apply veteran RB role-achievability sanity check
        run: python scripts/apply-rb-veteran-achievability.py
      - name: Reallocate suppressed RB opportunity within backfields
        run: python scripts/reallocate-rb-achievability-opportunity.py
      - name: Optimize RB committee opportunity
        run: python scripts/optimize-rb-committee-opportunity.py
      - name: Apply RB negative role decay and total-touch plausibility
        run: python scripts/apply-rb-role-decay-touch-plausibility.py
      - name: Apply evidence-sensitive RB aging curve
        run: python scripts/apply-rb-aging-curve.py
      - name: Validate current roster context
        run: python scripts/validate-current-roster-context.py
      - name: Smoke test promoted runtime
        run: |
          node --input-type=module <<'JS'
          import { predictNextPprPerGame, historyConfidence, getProjectionModelSummary } from './projection-model-runtime.mjs';
          const sample = {position:'WR',games:17,targets_per_game:8,target_share:.25,air_yards_share:.30,wopr:.55,ppr_per_game:17};
          const prediction = predictNextPprPerGame(sample, 'WR');
          if (!Number.isFinite(prediction) || prediction < 0) throw new Error(`Invalid runtime prediction: ${prediction}`);
          if (historyConfidence(sample) !== 1) throw new Error('History confidence smoke test failed');
          const summary = getProjectionModelSummary();
          for (const pos of ['QB','RB','WR','TE']) if (!summary[pos]?.promoted) throw new Error(`${pos} model not promoted`);
          console.log('runtime prediction', prediction.toFixed(3));
          JS
      - name: Validate v0.4 and 2026 outputs
        run: |
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('data/projections/model_coefficients_v0_4.json'))
          for pos,m in d['models'].items(): print(pos,m['holdout_metrics'])
          teams=pd.read_csv('data/projections/team_context_2026.csv'); players=pd.read_csv('data/projections/player_role_context_2026.csv'); stats=pd.read_csv('data/projections/stat_projections_2026.csv'); coach=pd.read_csv('data/projections/coaching_scheme_context_2026.csv')
          if len(teams)!=32: raise SystemExit(f'Expected 32 teams, got {len(teams)}')
          if len(coach)!=32: raise SystemExit(f'Expected 32 coaching contexts, got {len(coach)}')
          eligible=stats[stats['projection_status'].isin(['modeled_veteran','returning_fallback','rookie_model'])]
          if len(eligible)<200: raise SystemExit(f'Unexpected projected set: {len(eligible)}')
          if eligible['half_ppr_points'].isna().any(): raise SystemExit('Projected players contain missing points')
          checks=['qb_environment_delta','coaching_scheme_multiplier','rookie_rb_college_applied','rb_workload_hierarchy_applied','rb_bellcow_scheme_applied','rb_rush_scheme_multiplier','rb_receiving_role_applied','rb_receiving_target_share','rb_rush_td_reconciled','rb_goal_line_score','rb_rush_td_sanity_adjusted','rb_td_sustainability_score','rb_team_scoring_index','rb_team_rush_td_expectation','rb_qb_rush_td_competition','rb_team_td_budget_blend','rb_talent_efficiency_applied','rb_talent_rush_multiplier','rb_talent_rec_multiplier','rb_rec_td_reconciled','rb_rec_td_share','rb_rec_td_high_value_score','rb_vacated_opportunity_applied','rb_vacated_opportunity_share','rb_vacated_inheritance_weight','rb_achievability_applied','rb_achievability_role_factor','rb_achievability_joint_multiplier','rb_achievability_reallocated','rb_reallocated_carries','rb_reallocated_targets','rb_committee_optimizer_applied','rb_committee_merit_score','rb_committee_carry_share','rb_committee_target_share','rb_committee_strength','rb_negative_role_decay_applied','rb_negative_role_target_multiplier','rb_touch_plausibility_applied','rb_touch_plausibility_multiplier','rb_age_curve_applied','rb_age_2026','rb_age_workload_multiplier','role_expansion_applied','target_hierarchy_multiplier','recent_role_multiplier','availability_neutral_multiplier','wr_depth_hierarchy_multiplier','target_growth_guardrail_applied','wr_efficiency_multiplier','catch_rate_regression_applied','td_allocation_share']
          for col in checks:
              if col not in stats.columns: raise SystemExit(f'Missing validation field: {col}')
          print('RB vacated opportunity applied',int(stats['rb_vacated_opportunity_applied'].fillna(False).sum())); print('RB committee optimized',int(stats['rb_committee_optimizer_applied'].fillna(False).sum())); print('RB age adjusted',int(stats['rb_age_curve_applied'].fillna(False).sum())); print('projected stat lines',len(eligible))
          PY
      - name: Upload projection build
        uses: actions/upload-artifact@v4
        with:
          name: roster-report-projection-build
          path: data/projections/
          retention-days: 30

# Generated projection data does not alter live trade values until explicitly promoted.
