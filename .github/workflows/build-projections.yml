name: Build Projection Models

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-nflverse-features.py'
      - 'scripts/fit-projection-models.py'
      - 'scripts/apply-projection-models.py'
      - 'scripts/build-2026-context.py'
      - 'scripts/apply-2026-depth-charts.py'
      - 'scripts/build-2026-stat-projections.py'
      - 'projection-model-v0.4.mjs'
      - 'projection-model-runtime.mjs'
      - 'players.json'
      - '.github/workflows/build-projections.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Build 2023-2025 feature tables
        run: python scripts/build-nflverse-features.py

      - name: Fit next-season models
        run: python scripts/fit-projection-models.py

      - name: Build 2026 history-only baseline
        run: python scripts/apply-projection-models.py

      - name: Build 2026 team and player context
        run: python scripts/build-2026-context.py

      - name: Apply latest 2026 depth chart
        run: python scripts/apply-2026-depth-charts.py

      - name: Build 2026 veteran stat projections
        run: python scripts/build-2026-stat-projections.py

      - name: Smoke test promoted runtime
        run: |
          node --input-type=module <<'JS'
          import { predictNextPprPerGame, historyConfidence, getProjectionModelSummary } from './projection-model-runtime.mjs';
          const sample = {position:'WR',games:17,targets_per_game:8,target_share:.25,air_yards_share:.30,wopr:.55,ppr_per_game:17};
          const prediction = predictNextPprPerGame(sample, 'WR');
          if (!Number.isFinite(prediction) || prediction < 0) throw new Error(`Invalid runtime prediction: ${prediction}`);
          if (historyConfidence(sample) !== 1) throw new Error('History confidence smoke test failed');
          const summary = getProjectionModelSummary();
          for (const pos of ['QB','RB','WR','TE']) if (!summary[pos]?.promoted) throw new Error(`${pos} model not promoted`);
          console.log('runtime prediction', prediction.toFixed(3));
          JS

      - name: Validate v0.4 and 2026 outputs
        run: |
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('data/projections/model_coefficients_v0_4.json'))
          for pos,m in d['models'].items():
              print(pos, m['holdout_metrics'])
          teams=pd.read_csv('data/projections/team_context_2026.csv')
          players=pd.read_csv('data/projections/player_role_context_2026.csv')
          stats=pd.read_csv('data/projections/stat_projections_2026.csv')
          if len(teams)!=32: raise SystemExit(f'Expected 32 teams, got {len(teams)}')
          if len(players)<150: raise SystemExit(f'Unexpected player context: {len(players)}')
          modeled=stats[stats['projection_status'].eq('modeled_veteran')]
          if len(modeled)<150: raise SystemExit(f'Unexpected modeled set: {len(modeled)}')
          if modeled['half_ppr_points'].isna().any(): raise SystemExit('Modeled veterans contain missing projections')
          if 'depth_matched' not in players.columns: raise SystemExit('Depth-chart context missing')
          print('team contexts',len(teams))
          print('player contexts',len(players))
          print('depth matched',int(players['depth_matched'].sum()))
          print('depth starters',int(players['depth_starter'].sum()))
          print('QB backups gated',int(players['qb_depth_backup_flag'].sum()))
          print('manual/rookie pathway',int(players['needs_rookie_or_manual_role'].sum()))
          print('modeled veteran stat lines',len(modeled))
          PY

      - name: Upload projection build
        uses: actions/upload-artifact@v4
        with:
          name: roster-report-projection-build
          path: data/projections/
          retention-days: 30

# Generated projection data does not alter live trade values until explicitly promoted.
