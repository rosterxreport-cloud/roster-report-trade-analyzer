name: Week 4 V3 Backtest
on:
  push:
    paths:
      - 'scripts/week4_v3_backtest.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow
      - run: python scripts/week4_v3_backtest.py
      - name: Commit results
        run: |
          git config user.name "roster-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtests/week4_v3_results.csv data/backtests/week4_v3_summary.md
          git diff --cached --quiet || git commit -m "Run reproducible Week 4 v3 backtest"
          git push
