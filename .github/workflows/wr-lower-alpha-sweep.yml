name: WR Lower Alpha Sweep
on:
  push:
    paths: ['scripts/projection_wr_alpha_sweep2.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        alpha: ['0.10','0.15','0.20','0.25','0.30','0.35','0.40']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_alpha_sweep2.py --alpha ${{ matrix.alpha }} --out data/backtests/wr_alpha2/a${{ matrix.alpha }}
