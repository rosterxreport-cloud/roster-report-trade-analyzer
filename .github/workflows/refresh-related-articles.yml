name: Refresh related Substack articles
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: related-substack-articles
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh-related-articles.py
      - run: node --test tests/test-related-articles.mjs
      - name: Publish updated article index
        run: |
          if ! git diff --quiet -- data/related-articles.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/related-articles.json
            git commit -m 'Refresh related Substack article links'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
