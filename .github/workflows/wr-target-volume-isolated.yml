name: WR Target Volume Isolated Test
on:
  push:
    paths: ['scripts/projection_wr_target_volume.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        targetweight: ['0.00','0.10','0.20','0.30','0.40','0.50','0.75','1.00']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_target_volume.py --stat ydspg --weight 0.30 --exp-weight 1.00 --target-weight ${{ matrix.targetweight }} --out data/backtests/wr_target_volume/${{ matrix.targetweight }}
