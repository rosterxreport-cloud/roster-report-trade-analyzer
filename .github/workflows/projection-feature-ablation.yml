name: Projection Feature Ablation
on:
  push:
    paths: ['scripts/projection_ablation_backtest.py']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_ablation_backtest.py
      - run: |
          git config user.name "roster-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtests/ablation
          git diff --cached --quiet || git commit -m "Run projection feature ablation audit"
          git push
