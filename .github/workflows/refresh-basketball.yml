name: Refresh basketball points inputs
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: basketball-points-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and validate basketball inputs only
        run: python3 scripts/refresh-basketball.py
      - name: Check basketball calculations and full site build
        run: node --test tests/test-basketball.mjs tests/test-seo.mjs tests/test-app.mjs tests/test-scoring-settings.mjs tests/test-weekly-projections.mjs
      - name: Publish validated basketball snapshot
        run: |
          git config user.name "Roster Report basketball updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/basketball/players.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated basketball projected-stat snapshot"
            git push origin HEAD:main
          fi
