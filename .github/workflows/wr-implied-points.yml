name: WR Team Implied Points Test
on:
  push:
    paths: ['scripts/projection_wr_implied_points.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        impliedweight: ['0.00','0.10','0.20','0.30','0.40','0.50','0.75','1.00']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_implied_points.py --stat ydspg --weight 0.30 --exp-weight 1.00 --snap-weight 0.30 --def-weight 0.20 --implied-weight ${{ matrix.impliedweight }} --out data/backtests/wr_implied/${{ matrix.impliedweight }}
