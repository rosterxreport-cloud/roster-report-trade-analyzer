name: Refresh 2026 In-Season Player Data

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Run position-specific analytics experiment without publishing'
        required: false
        default: 'false'
  push:
    paths:
      - '.github/workflows/refresh-2026-player-data.yml'
      - 'scripts/refresh-live-player-data.py'
      - 'scripts/validate-live-player-data.py'
      - 'scripts/create-refresh-baseline.py'
      - 'scripts/build-scoring-profiles.py'
      - 'scoring-settings.js'
      - 'injury-adjustments.json'
      - 'scripts/build-new-rb-projection-preview.py'
  schedule:
    - cron: '17 9 * * 2'

permissions:
  contents: write

concurrency:
  group: refresh-2026-player-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned refresh dependencies
        run: pip install 'pandas==2.3.2' 'numpy==2.3.2' 'beautifulsoup4==4.13.5' 'pyarrow==21.0.0'
      - name: Refresh model and special teams
        shell: bash
        run: |
          if [[ ! -f data/live-refresh-baseline.json ]]; then
            python scripts/create-refresh-baseline.py
          fi
          # All refresh triggers run the full in-season model. The old push path
          # refreshed only K/DST, which left core QB/RB/WR/TE rankings stale after
          # model-code changes were merged.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.experiment }}" == "true" ]]; then
            # Projection experiments consume the current committed ranking model.
            # Do not rerun or mutate the production rankings pipeline.
            python scripts/build-new-rb-projection-preview.py
          else
            python scripts/refresh-live-player-data.py
            python scripts/build-scoring-profiles.py
          fi
          # Injury freshness is enforced only when this workflow can publish.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            python -c 'import json,datetime,pathlib; d=json.loads(pathlib.Path("injury-adjustments.json").read_text()); s=d.get("updatedAt"); assert s, "injury-adjustments.json has no updatedAt timestamp"; ts=datetime.datetime.fromisoformat(s.replace("Z","+00:00")); age=datetime.datetime.now(datetime.timezone.utc)-ts; assert age <= datetime.timedelta(days=7), f"injury-adjustments.json is stale ({age.days} days old); refresh injuries before publishing rankings"; print(f"Injury layer freshness OK: {s}")'
          fi
      - name: Fail-closed validation
        run: python scripts/validate-live-player-data.py && python tests/test-scoring-profiles.py
      - name: Verify My Team and Superflex
        run: node tests/test-app.mjs && node tests/test-scoring-settings.mjs
      - name: Detect website update
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- players.json scoring-profiles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload refresh summary
        uses: actions/upload-artifact@v4
        with:
          name: roster-report-refresh-${{ github.run_number }}
          path: |
            refresh-summary.md
            players.json
            scoring-profiles.json
            data/new-rb-projection-preview.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit validated website data
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name 'roster-report-data-bot'
          git config user.email 'rosterxreport@gmail.com'
          git add players.json data/live-refresh-baseline.json scoring-profiles.json
          git commit -m 'Refresh 2026 in-season player data'
          git push origin HEAD:main
