name: Refresh 2026 In-Season Player Data
# Requested refresh: completed Week 6 games, 2026-10-21.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Run position-specific analytics experiment without publishing'
        required: false
        default: 'false'
  push:
    paths:
      - '.github/workflows/refresh-2026-player-data.yml'
      - 'scripts/refresh-live-player-data.py'
      - 'scripts/refresh-injury-adjustments.py'
      - 'scripts/validate-live-player-data.py'
      - 'scripts/create-refresh-baseline.py'
      - 'scripts/build-scoring-profiles.py'
      - 'scoring-settings.js'
      - 'injury-adjustments.json'
  schedule:
    - cron: '17 9 * * 2'

permissions:
  contents: write

concurrency:
  group: refresh-2026-player-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned refresh dependencies
        run: pip install 'pandas==2.3.2' 'numpy==2.3.2' 'beautifulsoup4==4.13.5' 'pyarrow==21.0.0'
      - name: Refresh and validate injury data
        run: python scripts/refresh-injury-adjustments.py
      - name: Refresh model and special teams
        shell: bash
        run: |
          if [[ ! -f data/live-refresh-baseline.json ]]; then
            python scripts/create-refresh-baseline.py
          fi
          # All refresh triggers run the full in-season model. The old push path
          # refreshed only K/DST, which left core QB/RB/WR/TE rankings stale after
          # model-code changes were merged.
          python scripts/refresh-live-player-data.py --evidence data/ranking-evidence.pending.json
          python scripts/build-scoring-profiles.py
          # Injury adjustments are part of the same Tuesday publication cycle.
          # Fail closed if the injury file is stale so rankings cannot silently
          # publish with an outdated availability layer.
          python - <<'PY'
          import json, datetime, pathlib, sys
          p=pathlib.Path("injury-adjustments.json")
          d=json.loads(p.read_text())
          stamp=d.get("updatedAt")
          if not stamp:
              raise SystemExit("injury-adjustments.json has no updatedAt timestamp")
          ts=datetime.datetime.fromisoformat(stamp.replace("Z","+00:00"))
          age=datetime.datetime.now(datetime.timezone.utc)-ts
          if age > datetime.timedelta(days=7):
              raise SystemExit(f"injury-adjustments.json is stale ({age.days} days old); refresh injuries before publishing rankings")
          print(f"Injury layer freshness OK: {stamp}")
          PY
      - name: Fail-closed validation
        run: python scripts/validate-live-player-data.py && python tests/test-scoring-profiles.py
      - name: Verify My Team and Superflex
        run: node tests/test-app.mjs && node tests/test-scoring-settings.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build verified player profiles without blocking rankings
        id: profiles
        continue-on-error: true
        run: |
          mkdir -p .profile-candidate
          python scripts/build-player-evidence.py --output .profile-candidate/statistics.json
          node scripts/publish-player-profiles.mjs --evidence .profile-candidate/statistics.json --ranking-evidence data/ranking-evidence.pending.json --require-fresh
          node --test tests/test-player-analysis.mjs tests/test-player-profiles.mjs
      - name: Report retained profile snapshot
        if: steps.profiles.outcome == 'failure'
        run: |
          echo '::warning::Player profile update failed; the last validated profile snapshot is retained.'
          echo 'Player profiles: update failed. Last validated profiles retained; inspect the profile step logs.' >> "$GITHUB_STEP_SUMMARY"
          git restore -- data/player-profiles.json data/player-registry.json data/player-evidence.json
          if git ls-files --error-unmatch data/ranking-evidence.json >/dev/null 2>&1; then git restore -- data/ranking-evidence.json; else rm -f data/ranking-evidence.json; fi
      - name: Detect website update
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- players.json scoring-profiles.json injury-adjustments.json data/player-profiles.json data/player-registry.json data/player-evidence.json data/ranking-evidence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload refresh summary
        uses: actions/upload-artifact@v4
        with:
          name: roster-report-refresh-${{ github.run_number }}
          path: |
            refresh-summary.md
            players.json
            scoring-profiles.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit validated website data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'roster-report-data-bot'
          git config user.email 'rosterxreport@gmail.com'
          git add players.json data/live-refresh-baseline.json scoring-profiles.json injury-adjustments.json data/player-profiles.json data/player-registry.json data/player-evidence.json
          if [[ -f data/ranking-evidence.json ]]; then git add data/ranking-evidence.json; fi
          git commit -m 'Refresh 2026 in-season player data'
          git push origin HEAD:main

