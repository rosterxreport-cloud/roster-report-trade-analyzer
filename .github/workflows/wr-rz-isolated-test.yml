name: WR Red Zone Isolated Test
on:
  push:
    paths: ['scripts/projection_wr_rz_test.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rzweight: ['0.00','0.025','0.05','0.075','0.10','0.15','0.20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy lxml html5lib beautifulsoup4
      - run: python scripts/projection_wr_rz_test.py --rz-weight ${{ matrix.rzweight }} --out data/backtests/wr_rz/r${{ matrix.rzweight }}
