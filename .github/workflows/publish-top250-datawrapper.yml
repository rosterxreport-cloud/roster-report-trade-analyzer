name: Publish Top 250 to Datawrapper
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish-top250-datawrapper.py'
      - 'datawrapper/top-250-rankings-2026-week5.csv'
      - '.github/workflows/publish-top250-datawrapper.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and publish new sortable Top 250 table
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          DATAWRAPPER_ACCESS_TOKEN: ${{ secrets.DATAWRAPPER_ACCESS_TOKEN }}
        run: python scripts/publish-top250-datawrapper.py
      - name: Commit published chart link
        run: |
          git config user.name 'roster-report-data-bot'
          git config user.email 'rosterxreport@gmail.com'
          git add datawrapper/published-top250.json
          git commit -m 'Record published Datawrapper Top 250 chart' || exit 0
          git push origin HEAD:main
