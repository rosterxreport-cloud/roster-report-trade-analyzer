name: Toolkit Pro checks
on:
  pull_request:
  push:
    branches: [feat/toolkit-pro-platform]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test
      - run: node --check platform/platform.js && node --check api/pro.mjs
