name: QB 2025 V3 No Sacks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/tune-qb-model-2025-v3-nosacks.py']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy scikit-learn
      - run: python scripts/tune-qb-model-2025-v3-nosacks.py
      - uses: actions/upload-artifact@v4
        with:
          name: qb-2025-v3-nosacks
          path: |
            data/qb-2025-v3-nosacks-summary.csv
            data/qb-2025-v3-nosacks-detail.csv
