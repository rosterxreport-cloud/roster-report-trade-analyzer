name: Capture official DFS data
on:
  pull_request:
    paths:
      - scripts/pro/capture-draftkings.mjs
      - .github/workflows/capture-dfs-data.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/pro/capture-draftkings.mjs "$RUNNER_TEMP/dfs-capture"
      - uses: actions/upload-artifact@v4
        with:
          name: official-dfs-capture
          path: ${{ runner.temp }}/dfs-capture/
          retention-days: 7
