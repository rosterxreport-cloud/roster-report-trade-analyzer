name: WR Actual Explosive PBP Test
on:
  push:
    paths: ['scripts/projection_wr_explosive_pbp.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        expweight: ['0.50','0.60','0.70','0.80','1.00','1.25','1.50','2.00']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_explosive_pbp.py --stat ydspg --weight 0.30 --rec-weight 0 --exp-weight ${{ matrix.expweight }} --out data/backtests/wr_explosive_pbp/${{ matrix.expweight }}
