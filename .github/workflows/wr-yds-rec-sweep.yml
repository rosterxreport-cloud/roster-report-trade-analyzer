name: WR Yards Receptions Sweep
on:
  push:
    paths: ['scripts/projection_wr_yds_rec_sweep.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  yards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        weight: ['0.30','0.35','0.40','0.45','0.50','0.60']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_yds_rec_sweep.py --stat ydspg --weight ${{ matrix.weight }} --rec-weight 0 --out data/backtests/wr_yds/${{ matrix.weight }}
  receptions:
    runs-on: ubuntu-latest
    needs: yards
    strategy:
      matrix:
        recweight: ['0.05','0.10','0.15','0.20','0.25','0.30']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_yds_rec_sweep.py --stat ydspg --weight 0.50 --rec-weight ${{ matrix.recweight }} --out data/backtests/wr_yds_rec/${{ matrix.recweight }}
