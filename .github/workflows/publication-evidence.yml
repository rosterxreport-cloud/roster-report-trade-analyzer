name: Capture public publication evidence
on:
  pull_request:
    paths:
      - scripts/pro/capture-publication.mjs
      - .github/workflows/publication-evidence.yml
permissions:
  contents: read
jobs:
  capture:
    # One-time attempt completed; Substack returned a bot challenge. Preserve
    # its artifact and do not automatically repeat blocked requests on later PRs.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/pro/capture-publication.mjs "$RUNNER_TEMP/publication-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-publication-evidence
          path: ${{ runner.temp }}/publication-evidence/
          retention-days: 7
