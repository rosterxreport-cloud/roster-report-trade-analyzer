name: Minimal RB WR Backtest
on:
  push:
    paths: ['scripts/projection_minimal_rb_wr.py']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_minimal_rb_wr.py
      - run: |
          git config user.name "roster-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtests/minimal_rb_wr
          git diff --cached --quiet || git commit -m "Run minimal RB WR backtest"
          git push
