name: Publish Datawrapper Projection Tables

on:
  push:
    paths:
      - '.github/workflows/publish-datawrapper.yml'
      - 'scripts/publish-datawrapper-projections.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current projection previews
        run: |
          python scripts/build-new-rb-projection-preview.py
          python scripts/build-new-wr-projection-preview.py
          python scripts/build-new-qb-projection-preview.py
          python scripts/build-new-te-projection-preview.py
      - name: Update and publish permanent Datawrapper charts
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
        run: python scripts/publish-datawrapper-projections.py
