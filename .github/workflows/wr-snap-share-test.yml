name: WR Snap Share Test
on:
  push:
    paths: ['scripts/projection_wr_snap_share.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_snap_share.py --snap-weight 0.10 --exp-weight 1.00 --out data/backtests/wr_snap_probe
