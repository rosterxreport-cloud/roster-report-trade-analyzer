name: Refresh statistical leaderboards

on:
  workflow_dispatch:
  push:
    branches: [feat/toolkit-pro-platform]
    paths:
      - scripts/refresh-leaderboards.py
      - .github/workflows/refresh-stat-leaderboards.yml

permissions:
  contents: write

concurrency:
  group: stat-leaderboards-preview
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/feat/toolkit-pro-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toolkit-pro-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate season and recent statistics
        run: python scripts/refresh-leaderboards.py
      - name: Publish validated development snapshots
        run: |
          git add platform/stats/nfl.json.gz platform/stats/nba.json.gz platform/stats/mlb.json.gz
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh season and recent leaderboard statistics'
          git push origin HEAD:feat/toolkit-pro-platform
