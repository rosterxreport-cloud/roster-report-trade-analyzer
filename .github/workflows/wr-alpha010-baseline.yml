name: WR Alpha 010 Baseline
on:
  push:
    paths: ['scripts/projection_wr_alpha010.py']
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_alpha010.py
      - run: |
          git config user.name "roster-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtests/wr_alpha010
          git diff --cached --quiet || git commit -m "Save WR alpha 0.10 baseline results"
          git push
