name: Tuesday established NFL projections
on:
  schedule:
    - cron: '0,30 15,16,17 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/create-weekly-nfl.yml', 'scripts/pro/create-weekly-nfl.py', 'scripts/pro/test-weekly-nfl.py']
permissions:
  contents: write
concurrency:
  group: tuesday-established-nfl
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: pip install pandas==2.3.3 numpy==2.3.4 pyarrow==22.0.0
      - run: python scripts/pro/test-weekly-nfl.py
      - name: Tuesday publication, allowing hosted queue delays
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          RECOVERY_PUBLISH: ${{ contains(github.event.head_commit.message, '[publish-nfl]') }}
        run: |
          python - <<'PY'
          import importlib.util,os
          spec=importlib.util.spec_from_file_location('weekly','scripts/pro/create-weekly-nfl.py')
          weekly=importlib.util.module_from_spec(spec);spec.loader.exec_module(weekly)
          allowed=weekly.publication_allowed(os.environ['EVENT'],recovery=os.environ['RECOVERY_PUBLISH']=='true')
          print('NFL publication authorized.' if allowed else 'No publication requested or before Tuesday 8 AM Pacific.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('publish='+str(allowed).lower()+'\n')
          PY
      - name: Generate from fresh completed-week observations
        if: steps.gate.outputs.publish == 'true'
        run: python scripts/pro/create-weekly-nfl.py --output /tmp/rr-weekly
      - name: Publish one validated Tuesday snapshot
        if: steps.gate.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import datetime,json,pathlib,shutil
          from zoneinfo import ZoneInfo
          new=json.loads(pathlib.Path('/tmp/rr-weekly/weekly-projections.json').read_text())
          old=json.loads(pathlib.Path('data/weekly-projections.json').read_text())
          today=datetime.datetime.now(ZoneInfo('America/Los_Angeles')).date()
          prior=datetime.datetime.fromisoformat(old['updatedAt'].replace('Z','+00:00')).astimezone(ZoneInfo('America/Los_Angeles')).date()
          if old['season']==new['season'] and old['week']==new['week'] and prior>=today:
              print('This week already published today; keeping the validated snapshot.')
          else:
              for p in pathlib.Path('/tmp/rr-weekly').iterdir():
                  if p.suffix not in ('.csv','.json'):continue
                  target=pathlib.Path('data/weekly-projections.json') if p.name=='weekly-projections.json' else pathlib.Path('data/projections')/p.name
                  shutil.copyfile(p,target)
          PY
          python scripts/build-player-evidence.py --output /tmp/rr-player-statistics.json
          python scripts/build-matchup-evidence.py --evidence /tmp/rr-player-statistics.json
          # Existing builder resolves evidence relative to the repository root.
          cp /tmp/rr-player-statistics.json data/player-evidence.candidate.json
          node scripts/publish-player-profiles.mjs --evidence data/player-evidence.candidate.json --require-fresh
          rm data/player-evidence.candidate.json
          node --test tests/test-weekly-projections.mjs tests/test-player-profiles.mjs tests/test-player-matchups.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-projections.json data/projections/ data/player-evidence.json data/player-profiles.json data/player-registry.json data/matchup-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Tuesday established NFL projections"
            # Archive and article jobs can update the branch during model execution.
            # Rebase disjoint changes, revalidate, and never force a publication.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              node --test tests/test-weekly-projections.mjs tests/test-player-profiles.mjs tests/test-player-matchups.mjs
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
# Schedule activation requires this workflow on the default branch.
# Publication stays on development pending explicit production approval.
