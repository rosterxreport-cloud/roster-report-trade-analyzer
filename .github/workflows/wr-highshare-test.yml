name: WR High Share Test
on:
  push:
    paths:
      - scripts/projection_wr_highshare.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        high: ['0.00','0.05','0.10','0.15','0.20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow numpy
      - run: python scripts/projection_wr_highshare.py --stat ydspg --weight 0.30 --exp-weight 1.00 --snap-weight 0.30 --def-weight 0.20 --over-weight 0.20 --mid-weight 0.20 --high-weight ${{ matrix.high }} --out data/backtests/wr_highshare/${{ matrix.high }}
